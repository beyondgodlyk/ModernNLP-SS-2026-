<text x="626" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text x="699.0" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Ignore padding</text>
<text x="699.0" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569">labels equal -100</text>
<line x1="48" y1="172" x2="902" y2="172" stroke="#e5e7eb"/>
<text x="475.0" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569">Padding positions should not contribute to the loss.</text>
