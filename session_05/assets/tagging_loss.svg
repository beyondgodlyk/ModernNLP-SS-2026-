<text x="251.0" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Tag logits</text>
<text x="251.0" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569">(B, T, K)</text>
<path d="M 353 107 H 373" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
<path d="M 373 101 L 382 107 L 373 113" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="380" y="66" width="190" height="82" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="402" cy="90" r="11" fill="#2563eb" opacity="0.9"/>
<text x="402" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
<text x="475.0" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Flatten</text>
<text x="475.0" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569">(B*T, K)</text>
<path d="M 577 107 H 597" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
