<svg xmlns="http://www.w3.org/2000/svg" width="950" height="235" viewBox="0 0 950 235" role="img" aria-label="Token tagging loss microscope">
<rect x="1" y="1" width="948" height="233" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="475" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Token tagging loss microscope</text>
<rect x="156" y="66" width="190" height="82" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<circle cx="178" cy="90" r="11" fill="#2563eb" opacity="0.9"/>
